version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: regtech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: regtech
      POSTGRES_USER: regtech
      POSTGRES_PASSWORD: regtech_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regtech -d regtech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
