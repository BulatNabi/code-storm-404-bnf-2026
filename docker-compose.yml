name: fintech-radar

services:
  backend:
    build: ./backend
    container_name: fintech-radar-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/radar.db
    networks:
      - fintech-radar-net

