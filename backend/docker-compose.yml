services:
  backend:
    build: .
    container_name: fintech-radar-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/radar.db
      - AI_SERVICE_URL=http://fintech-radar-ai:8001
      - KAFKA_BOOTSTRAP_SERVERS=138.124.54.72:9094
    networks:
      - fintech-radar-net

volumes:
  backend_data:
    name: fintech-radar-backend-data

networks:
  fintech-radar-net:
    name: fintech-radar-net
    external: true
